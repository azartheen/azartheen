name: RSS Feeds Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Pull Stack Overflow feed into README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ─────────────────────────────
      # Latest Stack Overflow Q&A
      # Feed: user 8483046 (public — no key needed)
      # ─────────────────────────────
      - name: Sync Stack Overflow
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://stackoverflow.com/feeds/user/8483046"
          max_post_count: 5
          comment_tag_name: "STACKOVERFLOW"
          template: "- [$title]($url) — <sub>$date</sub>"
          commit_message: "chore: refresh Stack Overflow feed"

      # ─────────────────────────────
