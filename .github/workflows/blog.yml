name: Latest Blog Posts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Sync blog posts into README
    runs-on: ubuntu-latest
    steps:
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # TODO: replace `azartheen` below with your actual dev.to username if different.
          # For Medium/Hashnode/personal RSS, swap the feed_list URL.
          feed_list: "https://dev.to/feed/azartheen"
          max_post_count: 5
          template: "- [$title]($url) — <sub>$date</sub>"
          commit_message: "chore: update latest blog posts"
