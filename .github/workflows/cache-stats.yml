name: Cache Stats SVGs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache:
    name: Fetch and cache stat cards to repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure assets folder exists
        run: mkdir -p assets

      - name: Fetch all stat SVGs (skip write on invalid response)
        run: |
          set -eu

          fetch() {
            local url="$1"
            local out="$2"
            local tmp
            tmp=$(mktemp)
            echo "→ Fetching $out"
            if curl -sSL --max-time 30 "$url" -o "$tmp" \
                 && [ -s "$tmp" ] \
                 && head -c 500 "$tmp" | grep -q "<svg"; then
              mv "$tmp" "$out"
              echo "  ✅ Cached $out ($(wc -c <"$out") bytes)"
            else
              echo "  ⚠️  Invalid response — keeping previous cache for $out"
              rm -f "$tmp"
            fi
          }

          # Stats card (both themes) — card_width=440 matches README table cell
          fetch "https://github-readme-stats.vercel.app/api?username=azartheen&show_icons=true&count_private=true&include_all_commits=true&theme=tokyonight&hide_border=true&card_width=440" "assets/stats-dark.svg"
          fetch "https://github-readme-stats.vercel.app/api?username=azartheen&show_icons=true&count_private=true&include_all_commits=true&theme=default&hide_border=true&card_width=440"    "assets/stats-light.svg"

          # Top languages (compact) — card_width=500 matches README
          fetch "https://github-readme-stats.vercel.app/api/top-langs/?username=azartheen&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&card_width=500" "assets/top-langs-dark.svg"
          fetch "https://github-readme-stats.vercel.app/api/top-langs/?username=azartheen&layout=compact&theme=default&hide_border=true&langs_count=8&card_width=500"    "assets/top-langs-light.svg"

          # 31-day contribution activity graph
          fetch "https://github-readme-activity-graph.vercel.app/graph?username=azartheen&theme=tokyo-night&hide_border=true&area=true&radius=12&custom_title=Contribution%20Activity%20%E2%80%94%20last%2031%20days&bg_color=1a1b27&color=70a5fd&line=bf91f3&point=38bdae" "assets/activity-graph-dark.svg"
          fetch "https://github-readme-activity-graph.vercel.app/graph?username=azartheen&theme=minimal&hide_border=true&area=true&radius=12&custom_title=Contribution%20Activity%20%E2%80%94%20last%2031%20days"                                                        "assets/activity-graph-light.svg"

          # Hero + footer waves (capsule-render lives on vercel too — cache defensively)
          fetch "https://capsule-render.vercel.app/api?type=waving&color=gradient&customColorList=6,11,20&height=200&section=header&text=Azartheen&fontSize=60&fontColor=fff&animation=fadeIn&fontAlignY=32&desc=Full-Stack%20Software%20Engineer%20%E2%80%A2%20India&descAlignY=55&descSize=18" "assets/hero-wave.svg"
          fetch "https://capsule-render.vercel.app/api?type=waving&color=gradient&customColorList=6,11,20&height=120&section=footer" "assets/footer-wave.svg"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh cached stat SVGs"
            git push
          fi
